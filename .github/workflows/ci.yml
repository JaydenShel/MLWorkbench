name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend (ESLint, Prettier, Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Test (Jest with JUnit)
        run: npm run test:ci

      - name: Upload JUnit (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-frontend
          path: frontend/reports/junit/junit.xml

  backend:
    name: Backend (black, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Format check (black)
        run: black --check .

      - name: Ensure reports dir
        run: mkdir -p reports

      - name: Test (pytest → JUnit)
        run: pytest --junitxml=reports/junit.xml

      - name: Upload JUnit (backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/reports/junit.xml
